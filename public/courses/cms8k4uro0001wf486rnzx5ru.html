<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel | Interactive Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .split-container { display: flex; width: 100vw; height: 100vh; }
        .pane { flex: 1; display: flex; flex-direction: column; }
        .left-pane { border-right: 1px solid #334155; }
        .header { background-color: #1e293b; color: white; padding: 12px 20px; font-weight: 600; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.025em; }
        iframe { flex: 1; border: none; width: 100%; background: white; }
    </style>
</head>
<body>
    <div class="split-container">
        <!-- Left side: Slides -->
        <div class="pane left-pane">
            <div class="header">
                <span>Excel Course Materials</span>
                <span class="text-xs font-medium px-2.5 py-1 bg-blue-600/20 text-blue-400 rounded-full border border-blue-500/30">Module 1</span>
            </div>
            <iframe src="excel/update_link.html" title="Course Slides"></iframe>
        </div>
        
        <!-- Right side: Sandbox -->
        <div class="pane">
            <div class="header">
                <span class="text-emerald-400 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                    </svg>
                    Interactive Sandbox
                </span>
                <span class="text-xs text-slate-400">Practice Area</span>
            </div>
            <iframe src="excel/interactive_excel_sandbox.html" title="Excel Sandbox"></iframe>
        </div>
    </div>
</body>
</html>
